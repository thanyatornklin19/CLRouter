<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="CLRouter: the right model and effort for every prompt. Answers go to Haiku at low effort, code to Sonnet at medium, architecture to Opus at high.">
  <rect x="1" y="1" width="1198" height="358" rx="24" fill="#FAFAF7" stroke="#E6E3DA" stroke-width="2"/>
  <text x="72" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-2" fill="#1B1B18">CLRouter</text>
  <text x="75" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#6B6A63">The right model and effort,</text>
  <text x="75" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#6B6A63">for every prompt.</text>
  <text x="75" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#6B6A63">a Claude Code plugin</text>
  <rect x="560" y="152" width="120" height="56" rx="28" fill="#FFFFFF" stroke="#E6E3DA" stroke-width="1.5"/>
  <text x="620" y="186" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#1B1B18">prompt</text>
  <path d="M680 180 C 745 180, 735 90, 800 90" fill="none" stroke="#CBC7BC" stroke-width="2"/>
  <rect x="800" y="62" width="340" height="56" rx="28" fill="#FFFFFF" stroke="#E6E3DA" stroke-width="1.5"/>
  <circle cx="828" cy="90" r="7" fill="#2F8F6B"/>
  <text x="846" y="97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1B1B18">Haiku<tspan font-weight="400" fill="#6B6A63" font-size="17">  answers</tspan></text>
  <text x="1118" y="96" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#2F8F6B">low</text>
  <path d="M680 180 C 745 180, 735 180, 800 180" fill="none" stroke="#CBC7BC" stroke-width="2"/>
  <rect x="800" y="152" width="340" height="56" rx="28" fill="#FFFFFF" stroke="#E6E3DA" stroke-width="1.5"/>
  <circle cx="828" cy="180" r="7" fill="#B8742A"/>
  <text x="846" y="187" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1B1B18">Sonnet<tspan font-weight="400" fill="#6B6A63" font-size="17">  code</tspan></text>
  <text x="1118" y="186" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#B8742A">medium</text>
  <path d="M680 180 C 745 180, 735 270, 800 270" fill="none" stroke="#CBC7BC" stroke-width="2"/>
  <rect x="800" y="242" width="340" height="56" rx="28" fill="#FFFFFF" stroke="#E6E3DA" stroke-width="1.5"/>
  <circle cx="828" cy="270" r="7" fill="#4B5BA8"/>
  <text x="846" y="277" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1B1B18">Opus<tspan font-weight="400" fill="#6B6A63" font-size="17">  architecture</tspan></text>
  <text x="1118" y="276" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#4B5BA8">high</text>
</svg>
